name: Send Telegram Polls

on:
  schedule:
    # 18:00 UTC відповідає 21:00 за Київським часом (EET/EEST)
    # Запускається в Неділю (0), Вівторок (2), Четвер (4)
    - cron: '25 18 * * 2'
  workflow_dispatch: # Дозволяє запускати вручну для тестування

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run poll script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
